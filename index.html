<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สต๊อคกลางเสื้อผ้านักเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EEF1F6;--sf:#fff;--ink:#16213A;--mut:#5B6780;--line:#D5DBE7;--brand:#1C3F8C;--onb:#fff;--ok:#17804F;--okbg:#E3F4EA;--bad:#B3261E;--badbg:#FBE7E5;--warn:#9A5800;--warnbg:#FFF1D9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--sf:#182136;--ink:#E8ECF5;--mut:#9AA6BF;--line:#2B3752;--brand:#7FA6FF;--onb:#0F1626;--ok:#59D391;--okbg:#12301F;--bad:#FF8F86;--badbg:#3A1A18;--warn:#F2B35A;--warnbg:#38280E}}
:root[data-theme="dark"]{--bg:#0F1626;--sf:#182136;--ink:#E8ECF5;--mut:#9AA6BF;--line:#2B3752;--brand:#7FA6FF;--onb:#0F1626;--ok:#59D391;--okbg:#12301F;--bad:#FF8F86;--badbg:#3A1A18;--warn:#F2B35A;--warnbg:#38280E}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Thai",system-ui,"Noto Sans Thai",sans-serif}
header{background:var(--brand);color:var(--onb);padding:14px 20px 0}
header h1{margin:0;font-size:19px;font-weight:700}header p{margin:2px 0 10px;font-size:13px;opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:transparent;color:inherit;font:inherit;font-weight:500;padding:9px 16px;border-radius:8px 8px 0 0;cursor:pointer;opacity:.8;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--ink);opacity:1;font-weight:600}
main{max-width:1060px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>label{flex:1;min-width:140px;font-size:13px;color:var(--mut)}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:3px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:1px solid var(--brand);background:var(--brand);color:var(--onb);border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}.btn:disabled{opacity:.4;cursor:not-allowed}
.scan{border:2px dashed var(--brand);border-radius:12px;padding:14px;background:var(--bg)}
.scan input{font-size:18px;font-weight:600;letter-spacing:.5px}
.msg{margin-top:10px;padding:11px 14px;border-radius:8px;font-weight:600;min-height:44px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.idle{background:var(--bg);color:var(--mut);font-weight:400}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}.line b{font-weight:600}.line small{color:var(--mut)}
.bar{grid-column:1/-1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);transition:width .25s}
.bar.full i{background:var(--ok)}
.cnt{font-weight:700;font-size:20px;text-align:right}.cnt.full{color:var(--ok)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tools .btn{padding:5px 10px;font-size:12.5px;font-weight:500}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,.nm th:nth-child(2),.nm td:nth-child(2){text-align:left}
th{font-size:12.5px;color:var(--mut);font-weight:600;background:var(--bg)}
td.sum{font-weight:700}.nm td:nth-child(2){white-space:normal;min-width:210px}tfoot td{font-weight:700;background:var(--bg)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.low{background:var(--warnbg);color:var(--warn)}.tag.zero{background:var(--badbg);color:var(--bad)}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600;font-size:13.5px}
.formula span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px}.formula em{font-style:normal;color:var(--mut)}
details{margin-top:4px}summary{cursor:pointer;font-weight:600;color:var(--brand)}
details ol{margin:8px 0 0;padding-left:20px;color:var(--mut);font-size:13.5px}details li{margin-bottom:6px}details li b{color:var(--ink)}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.log{font-size:13.5px}.log div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.in{color:var(--ok);font-weight:600}.out{color:var(--bad);font-weight:600}
.empty{color:var(--mut);padding:14px 0;text-align:center}

.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.hd h1{margin:0}.hd p{margin:0}
.ay{font-size:12px}.ay select{width:auto;background:var(--sf);margin-top:2px}
.qty{display:flex;align-items:center;gap:10px}.qty input{font-size:34px;text-align:center;font-weight:700;max-width:150px}.qb{padding:6px 20px;font-size:24px}
.clk{cursor:pointer}.sel td{background:var(--bg)}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ql{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12px;background:#fff;color:#000;break-inside:avoid}.ql img{width:100%;height:auto;image-rendering:pixelated;display:block;margin-bottom:4px}
.ok2{color:var(--ok);font-weight:600}.pd{color:var(--warn);font-weight:600}
@media print{header,.np,.ov{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card{border:0;padding:0}}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.th .p{position:relative}
.th img,.mini{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:block}
.mini{width:40px;height:40px;border-radius:6px}
.th .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;font-size:15px;line-height:24px;padding:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--sf);border-radius:12px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.md .hd{margin-bottom:6px}.md .big{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block;background:var(--bg)}
.pk{display:flex;gap:8px;flex-wrap:wrap}.dz{border:1px dashed var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kp>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kp b{display:block;font-size:24px}.kp small{color:var(--mut)}
.cdw{margin-top:10px;display:flex;flex-direction:column;gap:6px}.cdw .btn{text-align:left}.vt{font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:6px}

 rl.forEach(l=>tx.push({id:uid(),t:'in',c:l.c,q:l.q,d,doc:rdr.d.trim()||'-',src:rdr.f,by:who.by,sy:false,im:rpend.slice()}));save();
 msg={k:'ok',t:`บันทึกรับเข้า ${rl.length} รายการ รวม ${rl.reduce((a,l)=>a+l.q,0)} ชิ้นแล้ว`+(rpend.length?` · แนบรูป ${rpend.length} รูป`:' · ยังไม่ได้แนบรูปใบรับสินค้า เพิ่มภายหลังได้ที่รายการล่าสุด')};
 rl=[];rpend=[];rcand=null;rdr={s:'',q:10,f:rdr.f,d:'',dt:''};render()}}

/* ---------- พิมพ์ QR ---------- */
let qf={cat:'',q:'',st:true,m:'cat'};const qrCat=i=>{try{const q=qrcode(0,'M');q.addData(qrBase()?qrBase()+'#cat='+i:'MV|CAT|'+i);q.make();return q.createImgTag(6,0,'QR หมวด '+i)}catch(e){return ''}};
const qrBase=()=>{let b='';try{b=(localStorage.getItem('stk_base')||'').trim()}catch(e){}if(!b&&/^https?:$/.test(location.protocol))b=location.href.split('#')[0];return b.split('#')[0]};
const qrImg=c=>{try{const q=qrcode(0,'M');q.addData(qrBase()?qrBase()+'#sku='+encodeURIComponent(c):'MV|'+c);q.make();return q.createImgTag(6,0,'QR '+c)}catch(e){return ''}};
function qr(){return `<div class="card"><h2>พิมพ์ป้าย QR สำหรับติดชั้นสินค้า</h2><label class="np" style="display:block;font-size:13px;color:var(--mut);margin-bottom:8px">ลิงก์หน้าเว็บที่ให้ QR เปิด (https://….github.io/…) ${qrBase()?'':'<b style="color:#c0392b">· ยังไม่ได้ใส่ QR จะเป็นข้อความธรรมดา แอปกล้องเปิดหน้าให้ไม่ได้</b>'}<input id="qb" value="${esc(qrBase())}" placeholder="https://mvpstore2568.github.io/STOCK-CHAINAT-09102569/"></label><div class="row np" style="margin-bottom:8px"><button class="btn${qf.m==='cat'?'':' ghost'}" data-qm="cat">ป้ายหมวดหมู่ (แนะนำ)</button><button class="btn${qf.m==='sku'?'':' ghost'}" data-qm="sku">ป้ายรายสินค้า</button></div><p class="sub np">${qf.m==='cat'?'1 หมวดต่อ 1 QR ติดที่ชั้นหรือกล่องของหมวดนั้น สแกนแล้วเลือกหลายรายการพร้อมกัน':'1 สินค้าต่อ 1 QR ติดที่ชั้นหรือกล่อง'}</p>
<div class="row np" style="margin-bottom:12px"><label style="flex:2">ค้นหา<input id="qq" value="${qf.q}" placeholder="ชื่อหรือรหัสสินค้า"></label><label>หมวดหมู่<select id="qc"><option value="">ทั้งหมด</option>${catOpts()}</select></label>
<label style="flex:0 0 auto;display:flex;align-items:center;gap:6px;padding-bottom:9px"><input type="checkbox" id="qs" style="width:auto;margin:0" ${qf.st?'checked':''}>เฉพาะที่มีของ</label><button class="btn" id="pr">พิมพ์ป้าย</button></div><div class="qg" id="qg"></div></div>`}
function drawQr(){if(qf.m==='cat'){const q=qf.q.trim().toLowerCase();$('qg').innerHTML=typeof qrcode==='undefined'?'<div class="msg bad">โหลดตัวสร้าง QR ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่</div>':CATS.map((n,i)=>({n,i:i+1,k:SKUS.filter(x=>x.cat===n)})).filter(o=>(!q||o.n.toLowerCase().includes(q))&&(!qf.st||o.k.some(x=>now(x).bal>0))).map(o=>`<div class="ql">${qrCat(o.i)}<b>${o.n}</b><br>${o.k.length} รายการ</div>`).join('')||'<div class="empty">ไม่พบหมวดหมู่</div>';return}const q=qf.q.trim().toLowerCase(),L=SKUS.filter(x=>(!qf.cat||x.cat===qf.cat)&&(!q||(x.n+x.c).toLowerCase().includes(q))&&(!qf.st||now(x).bal>0)).slice(0,150);
 $('qg').innerHTML=typeof qrcode==='undefined'?'<div class="msg bad">โหลดตัวสร้าง QR ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่</div>':L.map(x=>`<div class="ql">${qrImg(x.c)}<b>${x.n}</b><br>${x.c}</div>`).join('')||'<div class="empty">ไม่พบสินค้า</div>'}
function bQr(){$('qb').onchange=e=>{let v=e.target.value.trim();if(v&&!/^https:\/\//i.test(v)){alert('ต้องขึ้นต้นด้วย https://');return}try{localStorage.setItem('stk_base',v)}catch(x){}render()};document.querySelectorAll('[data-qm]').forEach(b=>b.onclick=()=>{qf.m=b.dataset.qm;render()});$('qq').oninput=e=>{qf.q=e.target.value;drawQr()};$('qc').value=qf.cat;$('qc').onchange=e=>{qf.cat=e.target.value;drawQr()};$('qs').onchange=e=>{qf.st=e.target.checked;drawQr()};$('pr').onclick=()=>window.print();drawQr()}

/* ---------- Google Sheet (ซิงค์จริง) ---------- */
const API_DEFAULT='https://script.google.com/macros/s/AKfycbzB-mA2NRlGP7yfrvnzEbegCcPPSqfUZvFlN3xYARfa9ZlQl8jlp9-z_E83IGhzvqGW6g/exec';/* วาง URL Web App (ลงท้ายด้วย /exec) ตรงนี้ครั้งเดียว ทุกเครื่องจะใช้ร่วมกัน */
const apiUrl=()=>{let u='';try{u=localStorage.getItem('stk_api')||''}catch(e){}return (u||API_DEFAULT).trim()};
let sync={k:'idle',t:''},chain=Promise.resolve(),syncTm;
async function api(body){const u=apiUrl();if(!u)throw new Error('no-url');
 const r=body?await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}):await fetch(u+(u.includes('?')?'&':'?')+'action=list&_='+Date.now());
 const j=await r.json();if(!j.ok)throw new Error(j.err||'api');return j}
function mergeSrv(list){const had=new Set(tx.map(t=>t.id)),ids=new Set(list.map(t=>t.id)),loc=new Map(tx.map(t=>[t.id,t]));
 const ch=list.some(t=>!had.has(t.id));
 const rest=tx.filter(t=>!ids.has(t.id)).map(t=>t.demo?t:{...t,sy:false});
 tx=list.map(t=>{const l=loc.get(t.id);return {...t,sy:true,...(l&&l.im?{im:l.im}:{})}}).concat(rest);persist();return ch}
const snapRows=()=>{idx();return SKUS.map(x=>[x.c,x.n,x.cat,now(x).bal])};
async function doSync(manual){if(!apiUrl()){sync={k:'idle',t:''};return updBadge()}
 try{const pend=tx.filter(t=>!t.sy&&!t.demo);let j;
  if(pend.length)j=await api({tx:pend.map(({im,sy,demo,...t})=>({...t,n:(sku(t.c)||{}).n||''}))});else j=await api();
  const ch=mergeSrv(j.tx);idx();
  if(pend.length||manual)await api({snap:snapRows()});
  sync={k:'ok',t:'เชื่อมต่อ Google Sheet แล้ว'};updBadge();if(ch||manual)softRender()}
 catch(e){sync={k:'bad',t:'ติดต่อ Google Sheet ไม่ได้ ('+(e.message||e)+')'};updBadge()}}
const syncNow=m=>chain=chain.then(()=>doSync(m));
function schedSync(){clearTimeout(syncTm);syncTm=setTimeout(()=>syncNow(),400)}
function softRender(){const a=document.activeElement;
 if(tab==='recv'||(tab==='disp'&&(cs||scanned||($('vd')&&$('vd').srcObject))))return;
 if(a&&(a.tagName==='SELECT'||a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.value)))return;render()}
const bg=document.createElement('div');bg.id='syn';document.body.appendChild(bg);
const stl=document.createElement('style');stl.textContent='#syn{position:fixed;left:10px;bottom:10px;z-index:50;font:600 12px system-ui,sans-serif;padding:6px 11px;border-radius:999px;box-shadow:0 1px 6px rgba(0,0,0,.25);background:#fff;color:#334}@media print{#syn{display:none}}';document.head.appendChild(stl);
function updBadge(){const n=tx.filter(t=>!t.sy&&!t.demo).length,u=apiUrl();
 const c=!u?'#888':sync.k==='bad'?'#c0392b':n?'#d98a00':'#1a7f37';
 bg.innerHTML=`<span style="color:${c}">●</span> `+(!u?'ยังไม่เชื่อม Google Sheet':sync.k==='bad'?'ส่งไม่ได้ · รอส่ง '+n:n?'กำลังส่ง · รอส่ง '+n:'ซิงค์ Google Sheet แล้ว')}
function startSync(){updBadge();syncNow();setInterval(()=>syncNow(),30000);addEventListener('online',()=>syncNow());document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()})}

function set(){const pd=tx.filter(t=>!t.sy&&!t.demo).length,u=apiUrl();
return `<div class="card" style="max-width:720px"><h2>เชื่อมต่อ Google Sheet</h2><p class="sub">ทุกการเบิกและรับเข้าถูกส่งไปเก็บในชีตของโรงเรียน และทุกเครื่องใช้ยอดคงเหลือชุดเดียวกัน</p>
<label style="font-size:13px;color:var(--mut)">ลิงก์ Web App (Apps Script)<input id="apiu" value="${esc(u)}" placeholder="https://script.google.com/macros/s/.../exec"></label>
<div class="row" style="margin-top:8px"><button class="btn" id="apis">บันทึกลิงก์และทดสอบ</button><button class="btn ghost" id="rs2">ซิงค์ตอนนี้</button></div>
<p class="msg ${sync.k==='bad'?'bad':sync.k==='ok'?'ok':'idle'}" style="margin:12px 0">สถานะ: ${u?(sync.t||'ยังไม่ได้ทดสอบ'):'ยังไม่ได้ตั้งค่าลิงก์'} · รายการรอส่ง ${pd} รายการ</p>
<h2 style="margin-top:16px">โครงสร้างในชีต</h2>
<div class="log"><div><span>แท็บ "รายการ"</span><span>ทุกรายการเบิก/รับเข้า: เวลา · ประเภท · เลขที่เอกสาร · รหัส · ชื่อ · จำนวน · วันที่ · ปลายทาง · ผู้ทำรายการ</span></div>
<div><span>แท็บ "คงเหลือ"</span><span>ยอดคงเหลือล่าสุดของทุกสินค้า อัปเดตทุกครั้งที่มีการเบิก/รับเข้า</span></div></div>
<p class="sub" style="margin-top:12px">ถ้าอินเทอร์เน็ตหลุด ระบบเก็บรายการไว้ในเครื่องก่อนและส่งให้เองเมื่อกลับมาออนไลน์</p></div>`}
function bSet(){$('apis').onclick=async()=>{try{localStorage.setItem('stk_api',$('apiu').value.trim())}catch(e){}sync={k:'idle',t:'กำลังทดสอบ…'};updBadge();await syncNow(true);render()};
 $('rs2').onclick=async()=>{await syncNow(true);render()}}

/* ---------- ตัวควบคุมหลัก ---------- */
const VIEWS={disp,rep,his,recv,qr,set},BIND={disp:bDisp,rep:bRep,his:bHis,recv:bRecv,qr:bQr,set:bSet};
function render(){stopCam();stopCam=()=>{};idx();
 $('nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;msg={k:'idle',t:tab==='recv'?'กรอกข้อมูลแล้วกดบันทึก':'พร้อมสแกน — สแกน QR ที่ป้ายสินค้า 1 ครั้งต่อรายการ'};render()});
 $('main').innerHTML=VIEWS[tab]()+dlist(tab==='disp');BIND[tab]();fillImgs()}
$('ay').innerHTML=AYS.map(a=>`<option value="${a}">${a+543} (พ.ค.${(a+543)%100}–เม.ย.${(a+544)%100})</option>`).join('');$('ay').value=ayc;$('ay').onchange=e=>{ayc=+e.target.value;render()};
const fromHash=()=>{const ms=/#sku=([^&]+)/.exec(location.hash);if(ms){const c=decodeURIComponent(ms[1]);if(MAP.has(c)){tab='disp';cs=null;if(now(sku(c)).bal>0){scanned=c;qv=1;msg={k:'ok',t:`สแกนแล้ว: ${nm(sku(c))} — ใส่จำนวนแล้วกด "เบิกเลย"`}}else{scanned=null;msg={k:'bad',t:`${nm(sku(c))} หมดในคลัง`}}return true}}
 const m=/#cat=(\d+)/.exec(location.hash),n=m&&CATS[+m[1]-1];if(n){tab='disp';openCat(n);msg={k:'ok',t:`สแกนหมวด: ${n} · ใส่จำนวนที่ต้องการแต่ละรายการ แล้วกดใส่ใบเบิก`};return true}return false};
addEventListener('hashchange',()=>{if(fromHash())render()});
fromHash();render();
startSync();
</script></body></html>
